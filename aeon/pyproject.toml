[project]
name = "aeon"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "datasets>=4.4.1",
    "infisicalsdk>=1.0.3",
    "lxml>=6.0.2",
    "openai>=2.7.1",
    "pandas>=2.3.3",
    "retry>=0.9.2",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "numpy>=2.2.6,<2.3.0",
    "tables>=3.10.2",
    "matplotlib>=3.10.7",
]

[project.scripts]
aeon = "aeon.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.1.1",
]
gpu = [
    # ARM Mac or GPU only
    "transformers>=4.57.0,<4.58.0",
    "torch>=2.9.0,<3.0.0",
    "vllm==0.12.0",
    "trl~=0.22.2",
    "xformers==0.0.33.post1",
    "unsloth[cu128-torch290] @ git+https://github.com/unslothai/unsloth.git@August-2025-v2",
    "bitsandbytes>=0.49.1",
    "unsloth-zoo>=2025.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeon"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
index-url = "https://pypi.org/simple/"
package = true
