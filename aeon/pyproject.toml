[project]
name = "aeon"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "datasets>=4.4.1",
    "infisicalsdk>=1.0.3",
    "lxml>=6.0.2",
    "openai>=2.7.1",
    "pandas>=2.3.3",
    "retry>=0.9.2",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    # TODO: Avoid constraining for now to avoid breaking gpu deps. Maybe can update once I get the env working
    # and see which numpy version it installs. UPDATE: it installed 2.2.6. But took me so long to get a working
    # env that I'm in no rush to mess with it.
    "numpy",
    "tables>=3.10.2",
    "matplotlib>=3.10.7",
]

[project.scripts]
aeon = "aeon.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.1.1",
]
gpu = [
    "unsloth==2025.7.2",
    "unsloth-zoo==2025.7.4",
    "vllm==0.8.5.post1",
    "transformers",
    "trl==0.19.1",
    "torchvision",
    "xformers",
    "bitsandbytes",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeon"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
index-url = "https://pypi.org/simple/"
package = true
